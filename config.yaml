# Настройки программы рейтинга. Меняйте значения здесь, код трогать не нужно.

team:
  name: "Аист-4"          # как команда пишется на сайте лиги
  rfll_id: 827            # номер из адреса rfll.ru/team/827

# Турниры. Матчи берутся со страницы команды rfll.ru/team/827/calendar
# (адрес без параметров: такие страницы правила сайта разрешают читать программам).
# Матч относится к группе по словам в названии турнира.
groups:
  championship: ["Чемпионат"]
  cup: ["Кубок", "Кубки"]
group_titles:
  championship: "Чемпионат"
  cup: "Кубок"

# Баллы за действия
weights:
  game: 1.0
  goal: 1.2
  assist: 1.0
  mvp: 1.5
  yellow: -0.5
  red: -1.0

# Бонус вратаря: max(0, (ожидаемые голы соперника - пропущено) * factor)
goalkeeper:
  factor: 0.3
  min_opponent_games: 3     # меньше игр у соперника: берется среднее по лиге
  default_league_avg: 6.0   # если данных о лиге нет совсем

# ВКонтакте (второй этап: бот опроса)
vk:
  group_id: 241645516
  captain: "lumwar"
  assistants: ["alexander__eremeev", "alex_khait", "id30136141", "ivkaur"]

site:
  title: "Рейтинг игроков Аист-4"

# Бот ВКонтакте
bot:
  league_group_id: 48420578          # сообщество лиги, где публикуются афиши с расписанием
  poster_aliases: ["АИСТ-4"]         # как команда пишется на афише
  chat_peer_group: 0                 # номер беседы команды (покажет «проверка ключей»)
  site_url: "https://lumen2310warrior-art.github.io/aist4-rating/"
  confirm_hours: 12                  # ожидание подтверждения расписания капитаном
  captain_hours: 48                  # ожидание выбора лучшего игрока капитаном
  assistants_hours: 24               # голосование помощников
  protocol_delay_hours: 2            # начинать искать протокол через N часов после начала матча
  protocol_search_hours: 72          # искать протокол не дольше N часов
  venues:
