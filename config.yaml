    "А2": "РФЛ Арена (Революционная, 64к1)"
    "А3": "РФЛ Арена (Революционная, 64к1)"
    "А4": "РФЛ Арена (Революционная, 64к1)"
    "С1": "РФЛ Арена (Московское шоссе, 122)"
    "С2": "РФЛ Арена (Московское шоссе, 122)"
    "ЗВ": "Стадион Звезда (Московское шоссе, 77)"
